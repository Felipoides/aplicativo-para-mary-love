name: Check mascot rendering on Android
on:
  workflow_dispatch:
    inputs:
      apk_run_id:
        description: Build run containing Mary-Love-APK
        required: true
        default: '35363404609'
permissions:
  contents: read
  actions: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Mary-Love-APK
          run-id: ${{ inputs.apk_run_id }}
          github-token: ${{ github.token }}
          path: apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: python3 -m pip install Pillow
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/smoke_mascots_android.py apk/app-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mascot-android-diagnostics
          path: diagnostics
          retention-days: 7
