name: Build editable mascot study
on:
  push:
    branches: [codex/night-sky-motion]
    paths: ['modeling/**', '.github/workflows/model-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download Blender
        run: |
          curl -fL https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
      - name: Model and render
        run: /tmp/blender-4.5.3-linux-x64/blender -b -t 4 --python modeling/create_study.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mascots-blender-study
          path: modeling/output
          retention-days: 14
